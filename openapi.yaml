openapi: 3.0.4
info:
  title: SEO Quick Validator
  description: >-
    SEO Quick Validator inspects live web pages for on-page SEO errors and tag
    issues. Pass any URL to inspect title lengths, meta descriptions, H1
    headings, viewport and canonical tags, image alt text, and unverified
    external links.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/seovalidator:
    post:
      summary: SEO Quick Validator
      description: Validate the SEO metrics of a web page
      operationId: seovalidator
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  url: https://apiverve.com
                  passed: false
                  issueCount: 6
                  issues:
                    - >-
                      Image missing 'alt' attribute:
                      '/assets/img/hero-diagram.png'
                    - 'Image missing ''alt'' attribute: ''/assets/img/logo-mark.svg'''
                    - >-
                      External link missing 'rel' attribute:
                      'https://twitter.com/apiverve'
                    - >-
                      External link missing 'rel' attribute:
                      'https://github.com/apiverve'
                    - >-
                      External link missing 'rel' attribute:
                      'https://status.apiverve.com'
                    - Missing meta 'keywords' tag in head
                  checks:
                    hasTitle: true
                    titleLength: 54
                    hasMetaDescription: true
                    metaDescriptionLength: 158
                    hasMetaKeywords: false
                    h1Count: 1
                    hasCanonical: true
                    hasViewport: true
                    imagesTotal: 8
                    imagesMissingAlt: 2
                    externalLinksTotal: 10
                    externalLinksMissingRel: 3
                  seoScore: 93
                  grade: A
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: The URL of the web page to validate the SEO metrics of
              required:
                - url
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
sampleRequest:
  url: https://apiverve.com
